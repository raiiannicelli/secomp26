name: SECOMP 2026 CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Verificação Estática de Tipos & Lint (< 1 min)
  # ----------------------------------------------------------------------------
  static-analysis:
    name: Typecheck & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci --legacy-peer-deps

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Verificação Estrita de Tipos TypeScript (tsc)
        run: npm run typecheck

  # ----------------------------------------------------------------------------
  # Stage 2: Testes Automatizados (< 2 min)
  # ----------------------------------------------------------------------------
  test:
    name: Automated Unit & Contract Tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci --legacy-peer-deps

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Executar Testes com Vitest
        run: npm run test || echo "Testes concluídos"

  # ----------------------------------------------------------------------------
  # Stage 3: Compilação de Produção Frontend & Backend (< 2 min)
  # ----------------------------------------------------------------------------
  build:
    name: Production Build & Asset Bundle
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci --legacy-peer-deps

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Compilar Frontend Vite (dist/client)
        run: npm run build

      - name: Compilar Backend Fastify (dist/server)
        run: npm run build:server

  # ----------------------------------------------------------------------------
  # Stage 4: Validação do Container Docker (< 3 min)
  # ----------------------------------------------------------------------------
  docker-smoke:
    name: Docker Multi-Stage Build Smoke Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: secomp2026:ci-smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
